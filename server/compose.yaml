# Central for Expediente Rosa: Valkey (event stream + folio counter) and the Hono server.
# Run from the repo root: docker compose -f server/compose.yaml up
name: expediente-rosa-central
services:
  valkey:
    image: valkey/valkey:8.1
    # Every write is fsynced to the AOF before the reply: an acknowledged event survives a crash.
    # ACL: the app uses er-central (see valkey/users.acl), scoped to {er}:* keys.
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "always", "--aclfile", "/etc/valkey/users.acl"]
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
      - ./valkey/users.acl:/etc/valkey/users.acl:ro
    healthcheck:
      test: ["CMD", "valkey-cli", "--user", "er-central", "--pass", "er-demo-pass", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  server:
    build: .
    environment:
      # Demo credential only; production injects a real secret.
      VALKEY_URL: redis://er-central:er-demo-pass@valkey:6379
      PORT: "8787"
    ports:
      - "8787:8787"
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

volumes:
  valkey-data:
