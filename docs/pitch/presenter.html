<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hilo · Notas de presentador</title>
<style>
  :root{--bg:#1f1a19;--card:#2b2422;--fg:#fcf8f6;--muted:#bcaea8;--rosa:#e07aa0;--ok:#5fbf86;--warn:#f0b54a;--bad:#ef6b5e}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:16px;display:flex;flex-direction:column;gap:14px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .timer{font-variant-numeric:tabular-nums;font-size:64px;font-weight:800;line-height:1;color:var(--ok)}
  .timer.warn{color:var(--warn)} .timer.bad{color:var(--bad)}
  .bar{height:8px;background:#3a3230;border-radius:99px;overflow:hidden}
  .bar>div{height:100%;background:var(--rosa);width:0}
  button{background:var(--card);color:var(--fg);border:1px solid #4a403d;border-radius:14px;padding:14px 16px;font-size:17px;cursor:pointer}
  button.primary{background:var(--rosa);color:#1f1a19;border-color:var(--rosa);font-weight:800}
  .note{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
  .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:15px}
  .who{background:var(--rosa);color:#1f1a19;border-radius:99px;padding:2px 12px;font-weight:800}
  .slide{border:1px solid #4a403d;border-radius:99px;padding:2px 10px}
  .title{font-size:28px;font-weight:800}
  .do{font-size:18px;line-height:1.4;background:#3a3230;border-radius:12px;padding:10px 12px}
  .do b{color:var(--warn)}
  .say{font-size:23px;line-height:1.4;color:#ffd9e6;border-left:4px solid var(--rosa);padding-left:12px}
  .nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
  .nav button{font-size:22px;padding:20px}
  .next{color:var(--muted);font-size:15px}
  .next b{color:var(--fg)}
</style>
</head>
<body>
<div class="top">
  <div class="timer" id="timer">0:00</div>
  <div style="display:flex;gap:8px">
    <button id="start" class="primary">▶ Iniciar</button>
    <button id="reset">↺</button>
  </div>
</div>
<div class="bar"><div id="progress"></div></div>

<section class="note" id="note"></section>
<div class="next" id="next"></div>

<div class="nav">
  <button id="prev">◀</button>
  <button id="nextBtn" class="primary">Siguiente ▶</button>
</div>

<script>
// One tap = one slide = one note. The phone walks this sequence; the Mac (screen.html) shows the same slide.
const NOTES = {
  1:  { who:"Los dos", title:"Portada", time:"antes de empezar",
        do:"Esperen la palabra. Toca <b>▶ Iniciar</b> y luego <b>Siguiente</b>.",
        say:"Somos Hilo, para EIRA Movimiento Rosa." },
  2:  { who:"Tú", title:"El problema", time:"0:00–0:25",
        do:"Solo habla. Despacio.",
        say:"EIRA viaja horas a comunidades sin señal.<br>Atiende hasta 150 mujeres en un día, con papel y Excel.<br>Si María regresa y nadie encuentra su historia, empieza de cero." },
  6:  { who:"Miguel en la app", title:"Buscar a María", time:"0:25–0:50",
        do:"<b>Cmd+Tab a Hilo.</b> Miguel escribe “Maria Ejenplo” → <b>Es la misma persona</b>.",
        say:"Aunque esté mal escrito, Hilo la encuentra y dice por qué.<br>Y nunca junta expedientes solo: decide una persona." },
  7:  { who:"Miguel en la app", title:"Su historia llega sola", time:"0:50–1:15",
        do:"<b>Nueva visita</b> → se ven los datos del historial → Guardar. Señala <b>“Sin conexión”</b>.",
        say:"Hilo ya trae su historia: solo se anota lo de hoy.<br>Y todo esto, sin internet." },
  8:  { who:"Tú", title:"Vuelve la señal", time:"1:15–1:40",
        do:"<b>Cmd+Tab a la presentación.</b> Solo cuéntalo.",
        say:"Dos brigadas, dos laptops, sin señal.<br>Cuando vuelve el internet, todo se junta solo:<br>un folio oficial, sin repetirse, y un solo expediente por mujer." },
  9:  { who:"Tú", title:"Lo íntimo, protegido", time:"1:40–1:55",
        do:"Solo dilo.",
        say:"La capturista no ve lo íntimo. El médico sí, y queda registro de quién lo vio." },
  11: { who:"Tú", title:"Segura por diseño", time:"1:55–2:30",
        do:"<b>La idea central.</b> Mira al jurado.",
        say:"Los datos se quedan en la laptop de EIRA, <b>cifrados</b>.<br>No es una página web: no hay un enlace que alguien pueda abrir.<br>Es una app nativa en Rust, para Windows, donde ellas ya trabajan.<br>El instalador pesa 4 megas: corre hasta en una laptop vieja." },
  13: { who:"Tú", title:"Cierre", time:"2:30–3:00",
        do:"Habla mirando al jurado. Termina con la frase.",
        say:"Cero licencias, las laptops que ya tienen y un servidor pequeño.<br>Es un prototipo con datos ficticios; lo siguiente es una jornada real con EIRA.<br><b>Hilo. Una mujer, una historia.</b>" },
  14: { who:"Preguntas", title:"Piloto y costos", time:"preguntas",
        do:"Úsala si preguntan por costos, riesgos u operación.",
        say:"¿Seguridad? Base cifrada, roles, bitácora, sin enlaces. La clave por laptop y el respaldo cifrado son del piloto.<br>¿Windows? Compila en CI; falta probarlo en sus laptops.<br>¿Costo? Licencias cero; servidor de 10 a 30 dólares al mes." },
};
const SEQ = [1, 2, 6, 7, 8, 9, 11, 13, 14];
const TOTAL = 180;
let pos = 0, running = false, startAt = 0, elapsed = 0;
const remote = location.protocol.startsWith("http");
const $ = (id) => document.getElementById(id);
const fmt = (s) => { const n = Math.max(0, Math.floor(s)); return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0"); };

function render() {
  const slide = SEQ[pos];
  const n = NOTES[slide];
  $("note").innerHTML =
    `<div class="meta"><span class="who">${n.who}</span><span class="slide">Diapositiva ${slide}</span><span>${n.time}</span></div>
     <div class="title">${n.title}</div>
     <div class="do">${n.do}</div>
     <div class="say">${n.say}</div>`;
  const nx = SEQ[pos + 1];
  $("next").innerHTML = nx ? `Después: <b>${NOTES[nx].title}</b> · ${NOTES[nx].who}` : "Fin";
}
function show(p, send) {
  pos = Math.min(SEQ.length - 1, Math.max(0, p));
  render();
  if (send && remote) fetch("/api/state", { method: "POST", body: JSON.stringify({ slide: SEQ[pos] }) }).catch(() => {});
}
function now() { return running ? elapsed + (performance.now() - startAt) / 1000 : elapsed; }
function tick() {
  const e = now();
  $("timer").textContent = fmt(e);
  $("timer").className = "timer" + (e >= TOTAL ? " bad" : e >= 150 ? " warn" : "");
  $("progress").style.width = Math.min(100, (e / TOTAL) * 100) + "%";
}
function toggle() {
  if (running) { elapsed = now(); running = false; $("start").textContent = "▶ Seguir"; }
  else { startAt = performance.now(); running = true; $("start").textContent = "⏸ Pausa"; }
}
$("start").onclick = toggle;
$("reset").onclick = () => { running = false; elapsed = 0; $("start").textContent = "▶ Iniciar"; tick(); };
$("prev").onclick = () => show(pos - 1, true);
$("nextBtn").onclick = () => show(pos + 1, true);
document.addEventListener("keydown", (e) => {
  if (e.key === " ") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowRight") show(pos + 1, true);
  else if (e.key === "ArrowLeft") show(pos - 1, true);
});
setInterval(tick, 250);

// Follow the Mac: if it shows a slide of the sequence, show its note (never moves the Mac on load).
async function follow() {
  try {
    const st = await (await fetch("/api/state", { cache: "no-store" })).json();
    const p = SEQ.indexOf(st.slide);
    if (p >= 0 && p !== pos) { pos = p; render(); }
  } catch (e) {}
}
render(); tick();
if (remote) { follow(); setInterval(follow, 1000); }
</script>
</body>
</html>
